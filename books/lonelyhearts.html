<title>calvin's reading list</title>

<style>
/* Page spacing */
body {
	margin: 0;
  font-family: Courier New;
} 

.text { 
	margin: 30px;
} 

/* Smooth scrolling */
html {
  scroll-behavior: smooth;
}
  
.header {
  background-color: #0039a3;
  display: flex;
  justify-content: space-between;
  padding: 5px;
  margin-bottom: 20px;
}

.header a {
  text-decoration: none;
  color: white;
} 

/* list components*/
ul > li { 
	list-style-type: none;
	font-style: bold;
} 

ol,li { 
	list-style-type:numbered;
} 

.author-list { 
	margin: 5px;
} 

/* text attributes*/
.dnf { 
	color: red;
} 

.read {	
	color: green;
} 

.reading { 
	color: orange;
} 

.retro-star {
    color: #CFB53B;
    font-size: 15px;
    text-shadow: 1px 1px 2px #aaa; 
}

.subtext { 
	font-size: 9px;
	font-style: italic;
} 

/* links */
a { 
	text-decoration: none;
} 

li > a:visited { 
	color:blue 
} 

/* table attributes*/

.book-images {
    margin-left: auto;
    margin-right: auto;
    border-collapse: collapse;
}

.book-images td {
    padding: 0;
}

.book-images img {
    width: 300px;
    display: block;
} 

.book-images .spine { 
	width: 100px;
} 

.book-title {
    margin-left: auto;
    margin-right: auto;
}

.book-title td {
    text-align: center;
} 

.book-info { 
	margin-left: auto;
    margin-right: auto;
} 

.book-info table { 
	border: 1px solid black;
}

.book-info th,
.book-info td { 
padding-left: 10px;
} 

.section-title {
	text-align: center;
	margin: 10px;
	font-size: 36px;
} 

</style>
